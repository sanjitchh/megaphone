# Minimal overrides layered on top of `--dev` (keys and single-node defaults come from --dev).
#
# enable_remote_unmute lets the host / room admins server-side unmute a participant
# (mutePublishedTrack muted=false). Without it LiveKit answers "remote unmute not
# enabled" and mute becomes one-way.
room:
    enable_remote_unmute: true

# Media ports, moved off LiveKit's defaults (7881/7882) so this stack runs next to
# Sentinel's. They must match the host ports published in docker-compose.yml: the
# ICE candidates LiveKit hands the browser carry these numbers verbatim.
rtc:
    tcp_port: 7891
    udp_port: 7892
