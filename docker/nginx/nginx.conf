# User and worker processes
user www-data;
worker_processes auto;
pid /run/nginx.pid;
daemon off;

# Worker connections and optimization
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Logging - stdout/stderr so `docker logs` sees everything
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 95;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer settings
    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    gzip_min_length 256;

    # Cache for static files
    open_file_cache max=5000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the scheme the *browser* used. A request arriving through the
    # edge proxy (docker/edge) already carries X-Forwarded-Proto: https;
    # overwriting it with $scheme (always http on this internal hop) would make
    # Laravel generate http:// URLs behind TLS.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Octane (Swoole) application server, supervised alongside nginx in this
    # same container. Nginx serves /app/public off disk and hands everything
    # else to Octane.
    upstream octane {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    # Virtual Host Configs
    include /etc/nginx/sites-enabled/*;
}
