server {
    listen 80;
    server_name mail.megaphone.local;
    return 301 https://$host:9443$request_uri;
}

server {
    listen 443 ssl;
    server_name mail.megaphone.local;

    ssl_certificate     /etc/nginx/ssl/star.megaphone.local.crt;
    ssl_certificate_key /etc/nginx/ssl/star.megaphone.local.key;

    client_max_body_size 100m;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_mailpit mailpit:8025;
        proxy_pass http://$upstream_mailpit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
