# Edge routing for megaphone.local. This proxy terminates TLS and routes by path
# to three containers; it holds no knowledge of the app's document root or
# framework - the web container serves those from its own nginx (docker/nginx/).
#
# HTTPS is published on host port 9443 (lmse-docker and sentinel-docker hold 443
# and 8443), so the plain-http block redirects to that port explicitly.

server {
    listen 80;
    server_name megaphone.local;
    return 301 https://$host:9443$request_uri;
}

server {
    listen 443 ssl;
    server_name megaphone.local;

    ssl_certificate     /etc/nginx/ssl/star.megaphone.local.crt;
    ssl_certificate_key /etc/nginx/ssl/star.megaphone.local.key;

    client_max_body_size 100m;

    # Reverb WebSocket. The browser can't use plain ws:// from an HTTPS page
    # (pusher-js forces wss), so terminate TLS here and proxy to the reverb
    # container's plain-ws port.
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        resolver 127.0.0.11 valid=30s;
        set $upstream_reverb reverb:8080;
        proxy_pass http://$upstream_reverb;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # LiveKit signal WebSocket - same story as Reverb: the page is on HTTPS, so it
    # needs wss. WebRTC *media* still flows direct to the host-published ports
    # (7891/tcp, 7892/udp).
    location /rtc {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        resolver 127.0.0.11 valid=30s;
        set $upstream_livekit livekit:7880;
        proxy_pass http://$upstream_livekit;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 9443;
        resolver 127.0.0.11 valid=30s;
        set $upstream_web web:80;
        proxy_pass http://$upstream_web;
        proxy_read_timeout 300;
    }
}
